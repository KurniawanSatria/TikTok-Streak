name: TikTok Streak

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug structure
        run: ls -R

      - name: Run script
        run: npm install && node index.js

      - name: Commit and push updated cookies
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cookies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update cookies [skip ci]" && git push)